name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      ARCADEIQ_TEST_DATABASE_URL: postgresql+psycopg://arcadeiq_test:arcadeiq_test@localhost:5432/arcadeiq_test
      ARCADEIQ_AI_ENABLED: "false"
      ARCADEIQ_AI_PROVIDER: rules

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: arcadeiq_test
          POSTGRES_USER: arcadeiq_test
          POSTGRES_PASSWORD: arcadeiq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arcadeiq_test -d arcadeiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s backend/tests -t backend

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
